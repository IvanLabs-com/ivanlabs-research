<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" role="img" aria-label="Of 41 pages on 15 JavaScript-framework sites, 27 had at least 90% of their rendered text in the raw HTML, 12 had 50 to 89%, and 2 had under 50%.">
<rect width="720" height="230" rx="8" fill="#FAFAF9"/>
<rect width="720" height="44" rx="8" fill="#0F172A"/><rect y="36" width="720" height="8" fill="#0F172A"/>
<text x="360.0" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#F9FAFB">How much of the rendered page was already in the raw HTML?</text>
<text x="40" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1A1A1A">Share of rendered words present in the raw HTML, per page (41 pages, 15 sites)</text>
<rect x="40.0" y="96" width="421.5" height="40" fill="#10B981"/>
<text x="250.7" y="121" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">27</text>
<rect x="461.5" y="96" width="187.3" height="40" fill="#1346BE"/>
<text x="555.1" y="121" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">12</text>
<rect x="648.8" y="96" width="31.2" height="40" fill="#EF4444"/>
<rect x="40" y="154" width="12" height="12" rx="2" fill="#10B981"/>
<text x="58" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1A1A1A">≥90% in raw HTML: 27 pages</text>
<rect x="250" y="154" width="12" height="12" rx="2" fill="#1346BE"/>
<text x="268" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1A1A1A">50–89% in raw HTML: 12 pages</text>
<rect x="460" y="154" width="12" height="12" rx="2" fill="#EF4444"/>
<text x="478" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1A1A1A">&lt;50% in raw HTML: 2 pages</text>
<text x="40" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6B7280">IvanLabs Study B, 2026-10-31. Raw = plain GET; rendered = headless Chrome after network idle (15 s cap).</text>
