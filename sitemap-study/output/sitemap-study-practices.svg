<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="Sitemap practices across 17 large sites: all declare sitemaps in robots.txt and 16 use a sitemap index; lastmod, image, query-string, hreflang and news usage vary.">
<rect width="720" height="380" rx="8" fill="#FAFAF9"/>
<rect width="720" height="44" rx="8" fill="#0F172A"/><rect y="36" width="720" height="8" fill="#0F172A"/>
<text x="360.0" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#F9FAFB">How 17 large sites build their XML sitemaps</text>
<text x="288" y="79" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1A1A1A">Declared in robots.txt</text>
<rect x="300" y="64" width="330" height="22" rx="3" fill="#E5E7EB"/>
<rect x="300" y="64" width="330.0" height="22" rx="3" fill="#1346BE"/>
<text x="640" y="79" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1A1A1A">17 of 17</text>
<text x="288" y="113" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1A1A1A">Uses a sitemap index</text>
<rect x="300" y="98" width="330" height="22" rx="3" fill="#E5E7EB"/>
<rect x="300" y="98" width="310.6" height="22" rx="3" fill="#1346BE"/>
<text x="640" y="113" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1A1A1A">16 of 17</text>
<text x="288" y="147" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1A1A1A">lastmod on index entries</text>
<rect x="300" y="132" width="330" height="22" rx="3" fill="#E5E7EB"/>
<rect x="300" y="132" width="194.1" height="22" rx="3" fill="#1346BE"/>
<text x="640" y="147" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1A1A1A">10 of 17</text>
<text x="288" y="181" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1A1A1A">lastmod on most URLs</text>
<rect x="300" y="166" width="330" height="22" rx="3" fill="#E5E7EB"/>
<rect x="300" y="166" width="232.9" height="22" rx="3" fill="#1346BE"/>
<text x="640" y="181" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1A1A1A">12 of 17</text>
<text x="288" y="215" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1A1A1A">Image sitemap extension</text>
<rect x="300" y="200" width="330" height="22" rx="3" fill="#E5E7EB"/>
<rect x="300" y="200" width="97.1" height="22" rx="3" fill="#1346BE"/>
<text x="640" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1A1A1A">5 of 17</text>
<text x="288" y="249" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1A1A1A">Query-string URLs listed</text>
<rect x="300" y="234" width="330" height="22" rx="3" fill="#E5E7EB"/>
<rect x="300" y="234" width="58.2" height="22" rx="3" fill="#1346BE"/>
<text x="640" y="249" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1A1A1A">3 of 17</text>
<text x="288" y="283" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1A1A1A">hreflang in sitemaps</text>
<rect x="300" y="268" width="330" height="22" rx="3" fill="#E5E7EB"/>
<rect x="300" y="268" width="38.8" height="22" rx="3" fill="#1346BE"/>
<text x="640" y="283" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1A1A1A">2 of 17</text>
<text x="288" y="317" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1A1A1A">News sitemap extension</text>
<rect x="300" y="302" width="330" height="22" rx="3" fill="#E5E7EB"/>
<rect x="300" y="302" width="58.2" height="22" rx="3" fill="#1346BE"/>
<text x="640" y="317" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1A1A1A">3 of 17</text>
<text x="24" y="364" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6B7280">IvanLabs Study A, 2026-10-30. 154 child sitemaps sampled (up to 10 per site, seeded).</text>
</svg>
